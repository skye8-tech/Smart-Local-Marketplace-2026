
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Seller Dashboard | Smart Local Marketplace</title>

    <link rel="stylesheet" href="../style/style.css" />
    <link rel="stylesheet" href="../style/seller-dashboard.css" />
  </head>

  <body>
    <header class="seller-header">
      <div class="logo">
        <h2>Smart Local Marketplace</h2>
      </div>

      <button type="button" id="seller-logout" class="logout-btn">
        Logout
      </button>
    </header>

    <main class="seller-dashboard">
      <div class="dashboard-container">
        <section class="dashboard-welcome">
          <div>
            <p class="dashboard-label">Seller Dashboard</p>

            <h1>
              Welcome,
              <span id="seller-name"> Seller </span>
            </h1>

            <p id="business-name">Seller Store</p>
          </div>

          <div class="seller-status">
            <span> Account Status </span>

            <strong id="seller-status"> Pending </strong>
          </div>
        </section>

        <section class="dashboard-stats">
          <div class="stat-card">
            <div class="stat-icon">📦</div>

            <div>
              <p>Total Products</p>

              <h2 id="total-products">0</h2>
            </div>
          </div>
        </section>

        <section class="dashboard-actions">
          <button type="button" id="show-add-product" class="add-product-btn">
            + Add Product
          </button>
        </section>

        <section
          id="add-product-section"
          class="add-product-section"
          style="display: none"
        >
          <div class="section-header">
            <div>
              <h2>Add New Product</h2>

              <p>Add a product to your store.</p>
            </div>

            <button type="button" id="cancel-add-product" class="cancel-btn">
              Cancel
            </button>
          </div>

          <form id="seller-product-form" class="seller-product-form">
            <div class="form-group">
              <label for="product-name"> Product Name </label>

              <input
                type="text"
                id="product-name"
                placeholder="Enter product name"
                required
              />
            </div>

            <div class="form-group">
              <label for="product-category"> Category </label>

              <select id="product-category" required>
                <option value="">Select Category</option>

                <option value="Fashion">Fashion</option>

                <option value="Electronics">Electronics</option>

                <option value="Beauty">Beauty</option>

                <option value="Food">Food</option>

                <option value="Home">Home</option>

                <option value="Shoes">Shoes</option>

                <option value="Accessories">Accessories</option>

                <option value="Agriculture">Agriculture</option>

                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="product-price"> Price </label>

              <input
                type="number"
                id="product-price"
                placeholder="Enter price"
                min="0"
                required
              />
            </div>

            <div class="form-group">
              <label for="product-stock"> Stock </label>

              <input
                type="number"
                id="product-stock"
                placeholder="Enter stock quantity"
                min="0"
                required
              />
            </div>

            <div class="form-group">
              <label for="product-image"> Product Image </label>

              <input type="file" id="product-image" accept="image/*" required />
            </div>

            <div class="form-group">
              <label for="product-description"> Product Description </label>

              <textarea
                id="product-description"
                rows="5"
                placeholder="Describe your product"
                required
              ></textarea>
            </div>

            <button type="submit" class="add-product-btn">Add Product</button>
          </form>
        </section>

        <section class="my-products">
          <div class="section-header">
            <div>
              <h2>My Products</h2>

              <p>Products you have added to the marketplace.</p>
            </div>
          </div>

          <div id="seller-products-list" class="seller-products-grid">
            <p class="empty-products">No products added yet.</p>
          </div>
        </section>
      </div>
    </main>

    <script src="../script/seller-dashboard.js"></script>
  </body>
</html>
```
