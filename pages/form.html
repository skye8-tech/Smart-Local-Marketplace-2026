```html
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Place Order | Smart Local Marketplace</title>

    <link rel="stylesheet" href="../style/style.css" />
    <link rel="stylesheet" href="../style/form.css" />
  </head>

  <body>
    <div id="header"></div>

    <main class="order-page">
      <section class="order-section">
        <div class="container">
          <div class="section-title">
            <h1>Place Your Order</h1>

            <p>
              Complete your delivery information and choose your payment method.
            </p>
          </div>

          <div class="order-container">
            <div class="order-form-container">
              <form id="order-form">
                <h2>Customer Information</h2>

                <div class="form-group">
                  <label for="full-name"> Full Name </label>

                  <input
                    type="text"
                    id="full-name"
                    name="fullName"
                    placeholder="Enter your full name"
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="phone"> Phone Number </label>

                  <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="email"> Email Address </label>

                  <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                  />
                </div>

                <h2>Delivery Information</h2>

                <div class="form-group">
                  <label for="location"> Delivery Location </label>

                  <select id="location" name="location" required>
                    <option value="">Select your location</option>

                    <option value="bamenda">Bamenda</option>

                    <option value="buea">Buea</option>

                    <option value="douala">Douala</option>

                    <option value="yaounde">Yaoundé</option>

                    <option value="limbe">Limbe</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="address"> Delivery Address </label>

                  <textarea
                    id="address"
                    name="address"
                    rows="4"
                    placeholder="Enter your complete delivery address"
                    required
                  ></textarea>
                </div>

                <div class="form-group">
                  <label for="instructions">
                    Delivery Instructions
                    <span>(Optional)</span>
                  </label>

                  <textarea
                    id="instructions"
                    name="instructions"
                    rows="3"
                    placeholder="Any special delivery instructions?"
                  ></textarea>
                </div>

                <h2>Payment Method</h2>

                <div class="payment-method">
                  <label class="payment-option">
                    <input type="radio" name="payment" value="cash" required />

                    <span> Cash on Delivery </span>
                  </label>

                  <label class="payment-option">
                    <input type="radio" name="payment" value="mobile-money" />

                    <span> Mobile Money </span>
                  </label>
                </div>

                <button type="submit" class="place-order-btn">
                  Place Order
                </button>
              </form>
            </div>

            <aside class="order-summary">
              <h2>Order Summary</h2>

              <div id="order-items">
                <p>Loading your cart...</p>
              </div>

              <div class="summary-details">
                <div class="summary-row">
                  <span> Subtotal </span>

                  <span id="subtotal"> 0 FCFA </span>
                </div>

                <div class="summary-row">
                  <span> Delivery Fee </span>

                  <span id="delivery-fee"> 0 FCFA </span>
                </div>

                <div class="summary-row total">
                  <span> Total </span>

                  <span id="total"> 0 FCFA </span>
                </div>
              </div>
            </aside>
          </div>
        </div>
      </section>
    </main>

    <div id="footer"></div>

    <script src="../script/layout.js"></script>
    <script src="../script/form.js"></script>
  </body>
</html>
```
